name: Run Unit Tests on PR

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tarakki_local
          POSTGRES_USER: tarakki
          POSTGRES_PASSWORD: tarakki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Authenticate Maven with GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Run all JUnit tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tarakki_local
          SPRING_DATASOURCE_USERNAME: tarakki
          SPRING_DATASOURCE_PASSWORD: tarakki
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/