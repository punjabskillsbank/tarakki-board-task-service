# Server
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/tarakki_local
spring.datasource.username=tarakki
spring.datasource.password=tarakki

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect