# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tarakki_local
spring.datasource.username=tarakki
spring.datasource.password=tarakki

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka configs
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Topic name
audit.logging.topic=audit-logging-topic

logging.level.org.apache.kafka.clients.producer=DEBUG