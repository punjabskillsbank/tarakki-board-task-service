# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/tarakki_local
spring.datasource.username=tarakki
spring.datasource.password=tarakki

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka configs
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Topic name
audit.logging.topic=${AUDIT_LOGGING_TOPIC:audit-logging}

logging.level.org.apache.kafka.clients.producer=DEBUG


# Organization service
org.service.base-url=http://localhost:8082
org.api.endpoint=/api/organizations

restclient.connect-timeout-ms=3000
restclient.read-timeout-ms=5000